<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tural Osman</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; background: #fdfbf7; color: #1b2a4a; }
      .bar { position: fixed; inset: 0 0 auto 0; z-index: 2; display: flex; justify-content: flex-end; gap: 12px; padding: 12px; background: rgba(45,106,79,.94); }
      .bar a, .bar button { color: #fff; text-decoration: none; font-size: 14px; border: 1px solid rgba(255,255,255,.45); padding: 8px 12px; border-radius: 4px; background: transparent; cursor: pointer; }
      iframe { position: fixed; inset: 54px 0 0 0; width: 100%; height: calc(100% - 54px); border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <div class="bar"><button type="button" onclick="window.netlifyIdentity && window.netlifyIdentity.open()">Giris</button><a href="/admin/">Admin panel</a></div>
    <iframe src="https://6a463fcb2417b62f2e32b47d--turalosman.netlify.app" title="Tural Osman sayti"></iframe>
    <script>
      function hasIdentityToken(){return /invite_token|recovery_token|confirmation_token|email_change_token|access_token|_token/.test(window.location.hash||'')}
      if(window.netlifyIdentity){window.netlifyIdentity.on('init', user=>{if(!user&&hasIdentityToken()) window.netlifyIdentity.open()});window.netlifyIdentity.on('login',()=>{window.location.href='/admin/'})}
    </script>
  </body>
</html>
